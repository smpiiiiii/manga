<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ゆるふわ女医みなみ 第17話</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #0f0a1a 100%);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 12px; gap: 16px
        }
        .card {
            width: 500px; max-width: 100%; background: #1e1e30;
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(255,165,0,.15); border: 2px solid #ff9f43
        }
        .card-header {
            padding: 10px 14px;
            background: linear-gradient(135deg, #2d1b1e, #3e2a1a);
            border-bottom: 2px solid #ff9f43;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap
        }
        .card-header .ep {
            font-size: 11px; color: #fff;
            background: linear-gradient(135deg, #ff6b35, #ff9f43);
            padding: 2px 10px; border-radius: 10px; font-weight: 700
        }
        .card-header h2 { font-size: 15px; color: #ffb347; font-weight: 900; flex: 1; min-width: 120px }
        .card-header .tag { font-size: 10px; color: #888 }
        .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr }
        .cell { position: relative; overflow: hidden; border: 1px solid #3a2a1e; aspect-ratio: 1 }
        .cell img { width: 100%; height: 100%; object-fit: cover; display: block }
        .cell .num {
            position: absolute; top: 3px; right: 4px;
            background: linear-gradient(135deg, #ff6b35, #ff9f43);
            color: #fff; font-size: 9px; font-weight: 900;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; box-shadow: 0 1px 4px rgba(255,107,53,.3)
        }
        .b {
            position: absolute; background: rgba(255,255,255,.92);
            border: 1.5px solid #ff9f43; border-radius: 14px;
            padding: 4px 7px; font-size: 8.5px; font-weight: 700;
            line-height: 1.45; text-align: center; max-width: 115px;
            z-index: 10; color: #444; backdrop-filter: blur(2px)
        }
        .b::after { content: ''; position: absolute; width: 0; height: 0; border: 4px solid transparent }
        .b.d::after { bottom: -10px; left: 22%; border-top-color: #ff9f43 }
        .b.think { border-style: dashed; border-color: #ccc; color: #999; font-size: 7.5px; border-radius: 14px }
        .b.shout { border-radius: 6px; background: rgba(255,240,240,.95); border-color: #e74c3c; color: #c0392b }
        .b.guy { background: rgba(230,240,255,.95); border-color: #2980b9; color: #2c3e50 }
        .b.guy::after { border-top-color: #2980b9 }
        .b.sparkle { border-color: #e84393; background: rgba(255,240,250,.95); color: #c0392b }
        .n { position: absolute; background: rgba(255,107,53,.8); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 8px; z-index: 10 }
        .sfx { position: absolute; font-weight: 900; font-size: 14px; color: #ff9f43; text-shadow: 1px 1px 0 #111, -1px -1px 0 #111, 1px -1px 0 #111, -1px 1px 0 #111; z-index: 10 }
        .sweat { position: absolute; font-size: 18px; z-index: 10; animation: drip 1s ease-in-out infinite }
        @keyframes drip { 0%,100% { transform: translateY(0); opacity: 1 } 50% { transform: translateY(3px); opacity: .6 } }
        .card-footer {
            padding: 6px 12px;
            background: linear-gradient(135deg, #2d1b1e, #3e2a1a);
            border-top: 1px solid #ff9f43;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 9px; color: #888; flex-wrap: wrap; gap: 4px
        }
        .card-footer .series { color: #ffb347; font-weight: 700 }
        .card-footer .lesson { color: #ccc; font-weight: 700 }
        @media (max-width: 520px) {
            body { padding: 8px }
            .card { border-radius: 12px }
            .card-header h2 { font-size: 13px }
            .b { font-size: 7.5px; padding: 3px 5px; max-width: 48% }
            .b.think { font-size: 6.5px }
            .sfx { font-size: 12px }
            .n { font-size: 8px }
            .cell .num { width: 16px; height: 16px; font-size: 8px }
            .card-footer { font-size: 8px }
        }
    </style>
</head>
<body>
    <div class="card" id="ep17">
        <div class="card-header">
            <span class="ep">第17話</span>
            <h2>休日のスーパーで逃げ場なし🛒</h2>
            <span class="tag">🏖️ 休日あるある</span>
        </div>
        <div class="grid">
            <!-- コマ① 私服で楽しくお買い物 -->
            <div class="cell">
                <div class="num">①</div>
                <img src="yf17a.png">
                <div class="b sparkle" style="top:4px;right:4px;max-width:105px;font-size:8px">
                    今日は誰にも<br>邪魔されない<br>最高の休日〜♪✨
                </div>
                <div class="n" style="bottom:3px;left:3px;font-size:8px">※貴重な休日を満喫中</div>
            </div>
            <!-- コマ② 患者さんに見つかる -->
            <div class="cell">
                <div class="num">②</div>
                <img src="yf17b.png">
                <div class="b guy d" style="top:4px;left:4px;max-width:100px;font-size:8px">
                    あらー！<br>みなみ先生！？<br>こんなとこで！
                </div>
                <div class="b shout" style="bottom:8px;right:4px;max-width:90px;font-size:7.5px">
                    え…<br>田中さん!?😱
                </div>
                <div class="sfx" style="top:6px;right:6px;font-size:11px;color:#e74c3c">ﾊﾞｯﾀﾘ</div>
            </div>
            <!-- コマ③ 健康相談が始まる -->
            <div class="cell">
                <div class="num">③</div>
                <img src="yf17c.png">
                <div class="b guy d" style="top:4px;left:4px;max-width:110px;font-size:7.5px">
                    先生ちょうどよかった！<br>最近ね膝がね…<br>あと血圧もね…
                </div>
                <div class="b think" style="bottom:8px;right:4px;max-width:90px;font-size:7px">
                    （なんで休日に<br>無料の外来が<br>始まるの…😭）
                </div>
                <div class="sweat" style="bottom:10px;left:6px">😰💦</div>
                <div class="n" style="bottom:3px;left:3px;font-size:8px">※スーパーで即席外来開始</div>
            </div>
            <!-- コマ④ カゴを捨てて逃走 -->
            <div class="cell">
                <div class="num">④</div>
                <img src="yf17d.png">
                <div class="b shout" style="top:4px;left:4px;max-width:110px;font-size:8px">
                    す、すみません<br>急用思い出しました！！💨
                </div>
                <div class="sfx" style="top:6px;right:6px;font-size:14px;color:#ff6b35">ﾀﾞｯ!!</div>
                <div class="n" style="bottom:3px;left:3px;font-size:9px">※カゴの中の食材は全て置き去りにされた</div>
            </div>
        </div>
        <div class="card-footer">
            <span class="series">🛒 ゆるふわ女医みなみ</span>
            <span class="lesson">👩‍⚕️ 休日のスーパーには変装して行け</span>
        </div>
    </div>
</body>
</html>
