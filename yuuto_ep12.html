<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有能研修医ユウト 第12話</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }
        body { font-family: 'Zen Maru Gothic', sans-serif; background: linear-gradient(135deg, #0a0a1a 0%, #1a0a20 50%, #0d0d1a 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 16px }
        .card { width: 500px; max-width: 100%; background: #151520; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(200,80,120,.2); border: 2px solid #e74c3c }
        .card-header { padding: 10px 14px; background: linear-gradient(135deg, #201015, #18100e); border-bottom: 2px solid #e74c3c; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
        .card-header .ep { font-size: 11px; color: #fff; background: linear-gradient(135deg, #e74c3c, #ff6b6b); padding: 2px 10px; border-radius: 10px; font-weight: 700 }
        .card-header h2 { font-size: 15px; color: #ff6b6b; font-weight: 900; flex: 1 }
        .card-header .tag { font-size: 10px; color: #666 }
        .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr }
        .cell { position: relative; overflow: hidden; border: 1px solid #2a2020; aspect-ratio: 1; min-height: 200px }
        .cell img { width: 100%; height: 100%; object-fit: cover; display: block }
        .cell .num { position: absolute; top: 3px; right: 4px; background: linear-gradient(135deg, #e74c3c, #ff6b6b); color: #fff; font-size: 9px; font-weight: 900; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10 }
        .b { position: absolute; background: rgba(20,15,18,.88); border: 1.5px solid #e74c3c; border-radius: 12px; padding: 4px 7px; font-size: 10px; font-weight: 700; line-height: 1.45; text-align: center; max-width: 115px; z-index: 10; color: #ddd; backdrop-filter: blur(4px) }
        .b.think { border-style: dashed; border-color: #555; color: #999; font-size: 9px }
        .b.girl { background: rgba(40,20,25,.9); border-color: #ff6b6b; color: #ffaaaa }
        .b.cool { background: rgba(20,18,30,.92); border-color: #6c5ce7; color: #a29bfe }
        .n { position: absolute; background: rgba(231,76,60,.7); color: #fff; font-size: 7px; padding: 2px 6px; border-radius: 8px; z-index: 10 }
        .sfx { position: absolute; font-weight: 900; font-size: 14px; color: #ff6b6b; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; z-index: 10 }
        .card-footer { padding: 6px 12px; background: linear-gradient(135deg, #201015, #18100e); border-top: 1px solid #e74c3c; display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: #555; flex-wrap: wrap; gap: 4px }
        .card-footer .series { color: #ff6b6b; font-weight: 700 }
        .card-footer .lesson { color: #888; font-weight: 700 }
        .nav { width:500px; max-width:100%; display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:12px; font-weight:700 }
        .nav a { text-decoration:none }
        @media (max-width: 520px) { body { padding: 8px } .b { font-size: 9px; padding: 3px 5px; max-width: 48% } }
    </style>
</head>
<body>
    <div class="card" id="ep12">
        <div class="card-header">
            <span class="ep">第12話</span>
            <h2>元カノの"お見舞い"💔🔥</h2>
            <span class="tag">🖤 有能研修医シリーズ</span>
        </div>
        <div class="grid">
            <!-- コマ① 元カノと再会 -->
            <div class="cell"><div class="num">①</div><img src="yuuto12a.png">
                <div class="b girl" style="bottom:28px;left:4px;max-width:95px;font-size:9px">え…ユウト⁉︎<br>嘘でしょ…<br>ここの先生なの…？</div>
                <div class="b cool" style="bottom:4px;right:4px;max-width:85px;font-size:8.5px">…久しぶり。<br>変わんないね</div>
                <div class="n" style="top:3px;left:3px">※元カノが父親の付き添いで来院</div>
            </div>
            <!-- コマ② 余裕の診察 -->
            <div class="cell"><div class="num">②</div><img src="yuuto12b.png">
                <div class="b cool" style="top:4px;left:4px;max-width:90px;font-size:9px">お父さん、<br>経過は順調ですよ</div>
                <div class="b think" style="bottom:4px;right:4px;max-width:90px;font-size:8.5px">（…まだ俺のこと<br>意識してんな。<br>目が泳いでる）</div>
                <div class="sfx" style="top:5px;right:5px;font-size:10px;color:#a29bfe">ﾌｯ…</div>
            </div>
            <!-- コマ③ 廊下で口説く -->
            <div class="cell"><div class="num">③</div><img src="yuuto12c.png">
                <div class="b girl" style="top:4px;left:4px;max-width:90px;font-size:9px">…ねえ。<br>まだ一人なの？</div>
                <div class="b cool" style="bottom:4px;right:4px;max-width:95px;font-size:8.5px">…さあ。<br>今夜、当直明けに<br>確かめてみる？</div>
                <div class="n" style="bottom:3px;left:3px">※元カノ、袖を掴んで離さない</div>
            </div>
            <!-- コマ④ 翌朝の当直室 -->
            <div class="cell"><div class="num">④</div><img src="yuuto12d.png">
                <div class="b think" style="top:4px;left:4px;max-width:105px">（…やっぱ元カノは<br>勝手わかってるから<br>楽だな）</div>
                <div class="sfx" style="bottom:30px;right:5px;font-size:10px;color:#ff6b6b">ｽﾀ…ｽﾀ…☀️</div>
                <div class="n" style="bottom:3px;right:3px">※LINEの未読12件を既読スルー</div>
            </div>
        </div>
        <div class="card-footer">
            <span class="series">🖤 有能研修医ユウト</span>
            <span class="lesson">💔 元カノは体の相性が最強</span>
        </div>
    </div>
    <div class="nav">
        <a href="yuuto_ep11.html" style="color:#666">← 第11話</a>
        <a href="yuuto_gallery.html" style="color:#ff6b6b">ギャラリー →</a>
    </div>
</body>
</html>
