<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有能研修医ユウト - 投稿済みギャラリー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
body { background: #0a0a1a; color: #fff; font-family: 'Zen Maru Gothic', sans-serif; padding: 12px; min-height: 100vh }
h1 { font-size: 20px; text-align: center; margin: 12px 0; background: linear-gradient(135deg, #4bb8ff, #6c5ce7, #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900 }
.subtitle { text-align: center; font-size: 11px; color: #888; margin-bottom: 24px }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px }
.card { background: #1a1a2e; border-radius: 14px; overflow: hidden; text-decoration: none; display: block; color: #fff; border: 1px solid #2a2a4a; transition: transform .2s, box-shadow .2s }
.card:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(75,184,255,.3); border-color: #4bb8ff }
.card .title-bar { padding: 10px 12px; background: linear-gradient(135deg, #1a2a4e, #2a1a3e); border-bottom: 1px solid #333; display: flex; align-items: center; gap: 8px }
.card .ep-badge { font-size: 10px; color: #fff; background: linear-gradient(135deg, #6c5ce7, #4bb8ff); padding: 3px 8px; border-radius: 8px; font-weight: 900; white-space: nowrap; flex-shrink: 0 }
.card .ep-title { font-size: 13px; font-weight: 900; line-height: 1.3; color: #fff }
.card .info { padding: 8px 12px }
.tag { display: inline-block; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 700; margin-right: 3px; color: #fff }
.blue { background: #6c5ce7 }
.empty { text-align: center; padding: 60px 20px; color: #555; font-size: 14px }
.empty .icon { font-size: 48px; margin-bottom: 16px }
.footer { text-align: center; font-size: 10px; color: #555; margin: 20px 0; padding: 12px }
.footer span { color: #4bb8ff }
</style>
</head>
<body>
<h1>🩺 有能研修医ユウト 投稿済みギャラリー</h1>
<div class="subtitle">Xに投稿された作品が新しい順に並んでいます</div>
<div class="grid">
<!-- POSTED_EPISODES_START -->
<!-- POSTED_EPISODES_END -->
</div>
<div class="empty">
<div class="icon">📖</div>
まだ投稿された作品はありません。<br>投稿されると自動的にここに追加されます！
</div>
<div class="footer"><span>✨</span> AI Generated Manga Collection <span>✨</span></div>
</body>
</html>
